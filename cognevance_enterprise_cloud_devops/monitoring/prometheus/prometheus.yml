# ==============================================================================
# Prometheus Configuration
# Organization: Cognevance Technologies
# Project: Enterprise Cloud Infrastructure & DevOps Automation
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'cognevance-enterprise-monitor'
    environment: 'production'

# Alerting Rule Files
rule_files:
  - 'rules/alert-rules.yml'

# Scrape Configurations
scrape_configs:
  # Job 1: Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 2: Enterprise DevOps Flask Application Microservice
  - job_name: 'enterprise-devops-app'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['application:5000', 'host.docker.internal:5000', 'localhost:5000']
        labels:
          app: 'enterprise-devops-app'
          team: 'devops-engineering'
          tier: 'backend'

  # Job 3: Kubernetes Pod Discovery (Active when deployed inside Kubernetes)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - devops-enterprise
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
