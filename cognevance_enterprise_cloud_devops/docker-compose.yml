# ==============================================================================
# Enterprise Local Multi-Container Stack (Docker Compose)
# Organization: Cognevance Technologies
# Project: Enterprise Cloud Infrastructure & DevOps Automation
# ==============================================================================

version: '3.8'

services:
  # Microservice 1: Python Flask Application
  application:
    build:
      context: ./application
      dockerfile: Dockerfile
    image: cognevance/enterprise-devops-app:1.0.0
    container_name: enterprise-devops-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - PORT=5000
      - CLUSTER_NAME=local-docker-compose
      - KUBERNETES_NAMESPACE=local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devops-network

  # Microservice 2: Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: enterprise-devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    depends_on:
      application:
        condition: service_healthy
    networks:
      - devops-network

  # Microservice 3: Grafana Analytics & Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: enterprise-devops-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
